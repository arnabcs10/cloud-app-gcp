# =============================================================================
# Observability Secrets
# Update the stringData values before deploying, or manage via ExternalSecrets.
# =============================================================================
---
# Grafana admin credentials + SMTP password
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: ns-observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: observability-stack
type: Opaque
stringData:
  # TODO: Replace before deploying
  admin-user: "admin"
  admin-password: "admin"
  smtp-password: "admin"
---
# Alertmanager SMTP password
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp-secret
  namespace: ns-observability
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: observability-stack
type: Opaque
stringData:
  # TODO: Replace with Gmail App Password or equivalent
  smtp-password: "admin"
