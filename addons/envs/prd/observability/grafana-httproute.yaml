# HTTPRoute for Grafana — exposed via shared Gateway
# Matches the pattern used by vote-app and result-app httproutes
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: ns-observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: observability-stack
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway
  hostnames:
    - "grafana.voteing-app.gcp.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 3000
