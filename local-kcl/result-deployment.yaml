# Result Application Deployment (without cloud-sql-proxy)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: result-config
  namespace: voting-app
  labels:
    app: result
data:
  PORT: "80"
  PGHOST: "postgres.voting-app.svc.cluster.local"
  PGPORT: "5432"
  PGDATABASE: "voting_app"
  PGUSER: "postgres"
  PGPASSWORD: "postgres"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: voting-app
  labels:
    app: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z postgres.voting-app.svc.cluster.local 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      containers:
      - name: result
        image: arnabcs10/result-app:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: result-config
              key: PORT
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: result-config
              key: PGHOST
        - name: PGPORT
          valueFrom:
            configMapKeyRef:
              name: result-config
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            configMapKeyRef:
              name: result-config
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            configMapKeyRef:
              name: result-config
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            configMapKeyRef:
              name: result-config
              key: PGPASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: voting-app
  labels:
    app: result
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31001
    protocol: TCP
    name: http
  selector:
    app: result
