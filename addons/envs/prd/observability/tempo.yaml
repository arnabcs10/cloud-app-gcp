# =============================================================================
# Tempo Helm Chart Values
# Chart: grafana/tempo  v1.10.3
# Namespace: ns-observability
# Stage: testing (5GB storage, 3-day trace retention, 10% sampling)
# =============================================================================

replicas: 1

# Use existing service account
serviceAccount:
  create: false
  name: tempo

# -----------------------------------------------------------------------
# Persistence: 5GB for testing
# -----------------------------------------------------------------------
persistence:
  enabled: true
  storageClassName: standard-rwo
  accessModes:
    - ReadWriteOnce
  size: 5Gi

# -----------------------------------------------------------------------
# Tempo configuration
# -----------------------------------------------------------------------
tempo:
  reportingEnabled: false

  # OTLP receivers (gRPC + HTTP)
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  storage:
    trace:
      backend: local
      wal:
        path: /var/tempo/wal
      local:
        path: /var/tempo/blocks

  # 3-day retention for testing
  retention: 72h

  ingester:
    max_block_duration: 5m
    trace_idle_period: 10s
    max_block_bytes: 1000000

  compactor:
    compaction:
      block_retention: 72h

  # Metrics generator: pushes span-derived metrics to Prometheus
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-server.ns-observability.svc.cluster.local:9090/api/v1/write
    registry:
      external_labels:
        source: tempo
        cluster: cloud-app-gke-prd
    processors:
      - service-graphs
      - span-metrics

  querier:
    frontend_worker:
      frontend_address: localhost:9095

  query_frontend:
    search:
      duration_slo: 5s
    trace_by_id:
      duration_slo: 5s

  server:
    log_level: warn
    http_listen_port: 3200

# -----------------------------------------------------------------------
# Resources
# -----------------------------------------------------------------------
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# -----------------------------------------------------------------------
# Security context
# -----------------------------------------------------------------------
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
