# =============================================================================
# Tempo Helm Chart Values - Optimized for 4GB Cluster
# Chart: grafana/tempo v1.10.3
# Namespace: observability
# Distributed tracing with reduced resources
# =============================================================================

replicas: 1

# Use existing service account
serviceAccount:
  create: false
  name: tempo

# -----------------------------------------------------------------------
# Persistence: 3GB for small cluster (reduced from 5GB)
# -----------------------------------------------------------------------
persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 3Gi

# -----------------------------------------------------------------------
# Tempo configuration
# -----------------------------------------------------------------------
tempo:
  reportingEnabled: false

  # OTLP receivers (gRPC + HTTP)
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  storage:
    trace:
      backend: local
      wal:
        path: /var/tempo/wal
      local:
        path: /var/tempo/blocks

  # 2-day retention for small cluster (reduced from 3 days)
  retention: 48h

  ingester:
    max_block_duration: 5m
    trace_idle_period: 10s
    max_block_bytes: 500000  # Reduced from 1000000

  compactor:
    compaction:
      block_retention: 48h

  # Metrics generator: pushes span-derived metrics to Prometheus
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-server.observability.svc.cluster.local:9090/api/v1/write
    registry:
      external_labels:
        source: tempo
        cluster: local-test
    processors:
      - service-graphs
      - span-metrics

  querier:
    frontend_worker:
      frontend_address: localhost:9095

  query_frontend:
    search:
      duration_slo: 5s
    trace_by_id:
      duration_slo: 5s

  server:
    log_level: warn
    http_listen_port: 3200

# -----------------------------------------------------------------------
# Resources - Minimal for 4GB cluster
# -----------------------------------------------------------------------
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 25m
      memory: 256Mi

# -----------------------------------------------------------------------
# Security context
# -----------------------------------------------------------------------
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

# Service configuration
service:
  type: ClusterIP
  port: 3200
