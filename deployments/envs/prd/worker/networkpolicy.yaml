# Network Policy for Worker App
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-app-netpol
  namespace: ns-worker-app
spec:
  podSelector:
    matchLabels:
      app: worker-app
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow access to Redis
  - to:
    - namespaceSelector:
        matchLabels:
          app: voting-system
          component: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow access to Cloud SQL
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8  # Adjust based on your VPC CIDR
    ports:
    - protocol: TCP
      port: 5432
  # Allow outbound HTTPS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443