# Service accounts for observability components
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ns-observability
  labels:
    app: prometheus
    app.kubernetes.io/part-of: observability-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: ns-observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: observability-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: ns-observability
  labels:
    app: loki
    app.kubernetes.io/part-of: observability-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: ns-observability
  labels:
    app: promtail
    app.kubernetes.io/part-of: observability-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  namespace: ns-observability
  labels:
    app: tempo
    app.kubernetes.io/part-of: observability-stack
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: ns-observability
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: observability-stack
---
# ClusterRole for Prometheus to scrape metrics across all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/part-of: observability-stack
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/part-of: observability-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ns-observability
---
# ClusterRole for Promtail to read pod logs from all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
  labels:
    app: promtail
    app.kubernetes.io/part-of: observability-stack
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
  labels:
    app: promtail
    app.kubernetes.io/part-of: observability-stack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: ns-observability
